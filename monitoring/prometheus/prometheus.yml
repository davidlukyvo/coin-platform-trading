global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]
  - job_name: collector
    static_configs:
      - targets: ["collector:8000"]
  - job_name: bingx-collector
    static_configs:
      - targets: ["bingx-collector:8030"]
  - job_name: system-trading
    scheme: https
    tls_config:
      insecure_skip_verify: true
    static_configs:
      - targets: ["system-trading:8443"]
  - job_name: paper-trading
    static_configs:
      - targets: ["paper-trading:8050"]
  - job_name: paper-futures
    static_configs:
      - targets: ["paper-futures:8090"]
  - job_name: silver-processor
    static_configs:
      - targets: ["silver-processor:8010"]
  - job_name: strategy-research
    static_configs:
      - targets: ["strategy-research:8020"]
  - job_name: hybrid-signal-adapter
    static_configs:
      - targets: ["hybrid-signal-adapter:8060"]
  - job_name: wyckoff-shadow-adapter
    static_configs:
      - targets: ["wyckoff-shadow-adapter:8070"]
  - job_name: silver-quality-exporter
    scrape_interval: 30s
    static_configs:
      - targets: ["silver-quality-exporter:8081"]
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
