groups:
  - name: strategy-research
    rules:
      - alert: StrategyResearchDown
        expr: up{job="strategy-research"} == 0
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "Strategy research service is unavailable"}
      - alert: StrategyResearchFailed
        expr: strategy_research_errors > 0
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "Latest strategy research run failed"}
