groups:
  - name: wyckoff-shadow-adapter
    rules:
      - alert: WyckoffShadowAdapterDown
        expr: up{job="wyckoff-shadow-adapter"} == 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: Wyckoff shadow adapter is unavailable
      - alert: WyckoffShadowAdapterStale
        expr: time() - wyckoff_adapter_last_success_unixtime > 3900
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: Wyckoff shadow evaluation has not succeeded recently
      - alert: WyckoffShadowAdapterErrors
        expr: increase(wyckoff_adapter_errors_total[15m]) > 0
        labels: {severity: warning}
        annotations:
          summary: Wyckoff shadow adapter reported evaluation errors
      - alert: WyckoffMarketPhaseMissing
        expr: absent(wyckoff_market_phase_info)
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: Wyckoff VSA research projection has no market phase
      - alert: WyckoffResearchJournalStalled
        expr: changes(wyckoff_research_journal_rows[20m]) == 0 and up{job="wyckoff-shadow-adapter"} == 1
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: Wyckoff VSA exactly-once research journal is not advancing
