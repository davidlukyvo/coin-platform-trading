services:
  storage-init:
    image: alpine:3.20
    user: "0:0"
    command:
      - /bin/sh
      - -ec
      - |
        mkdir -p /host/bronze /host/quarantine /host/postgres /host/prometheus /host/grafana /host/node-exporter-textfile /host/silver /host/silver-quarantine /host/checkpoints/silver /host/reports/silver /host/research /host/system-trading /host/paper /host/paper-ui /host/hybrid-signals /host/wyckoff-signals /host/paper-futures /host/liquidity-structure /host/evidence-fusion
        chown -R 10001:10001 /host/bronze /host/quarantine
        chown -R 70:70 /host/postgres
        chown -R 65534:65534 /host/prometheus
        chown -R 472:472 /host/grafana
        chown -R 65534:65534 /host/node-exporter-textfile
        chown -R 10002:10002 /host/silver /host/silver-quarantine /host/checkpoints/silver /host/reports/silver
        chown -R 10003:10003 /host/research
        chown -R 10004:10004 /host/system-trading
        chown -R 10005:10005 /host/paper
        chmod 700 /host/paper
        chown -R 10005:10004 /host/paper-ui
        chmod 2750 /host/paper-ui
        chown -R 10006:10006 /host/hybrid-signals
        chmod 700 /host/hybrid-signals
        chown -R 10007:10009 /host/wyckoff-signals
        chmod 2750 /host/wyckoff-signals
        chown -R 10009:10009 /host/paper-futures
        chmod 700 /host/paper-futures
        chown -R 10010:10010 /host/liquidity-structure
        chmod 700 /host/liquidity-structure
        chown -R 10011:10011 /host/evidence-fusion
        chmod 700 /host/evidence-fusion
        test -w /host/bronze
        test -w /host/quarantine
        test -w /host/postgres
    volumes:
      - ${COIN_DATA_ROOT:-/data/coin-platform}:/host
    restart: "no"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      storage-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-coin_platform}
      POSTGRES_USER: ${POSTGRES_USER:-coin_platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      TZ: UTC
    volumes:
      - ${COIN_DATA_ROOT:-/data/coin-platform}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-coin_platform} -d ${POSTGRES_DB:-coin_platform}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 2g
    cpus: 1.5
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - coin-platform

  collector:
    build:
      context: ./services/collector
    restart: unless-stopped
    depends_on:
      storage-init:
        condition: service_completed_successfully
    environment:
      TZ: UTC
      BINANCE_WS_BASE: ${BINANCE_WS_BASE:-wss://stream.binance.com:9443}
      MARKET_SYMBOLS: ${MARKET_SYMBOLS:-btcusdt,ethusdt,solusdt}
      MARKET_STREAMS: ${MARKET_STREAMS:-aggTrade,kline_1m}
      RAW_DATA_ROOT: /data/bronze
      QUARANTINE_DATA_ROOT: /data/quarantine
      COLLECTOR_LOG_LEVEL: ${COLLECTOR_LOG_LEVEL:-INFO}
      COLLECTOR_METRICS_PORT: ${COLLECTOR_METRICS_PORT:-8000}
      COLLECTOR_QUEUE_SIZE: ${COLLECTOR_QUEUE_SIZE:-10000}
      COLLECTOR_STALE_AFTER_SECONDS: ${COLLECTOR_STALE_AFTER_SECONDS:-60}
      COLLECTOR_RECONNECT_MAX_SECONDS: ${COLLECTOR_RECONNECT_MAX_SECONDS:-60}
      COLLECTOR_WRITE_MAX_ATTEMPTS: ${COLLECTOR_WRITE_MAX_ATTEMPTS:-5}
    volumes:
      - ${COIN_DATA_ROOT:-/data/coin-platform}/bronze:/data/bronze
      - ${COIN_DATA_ROOT:-/data/coin-platform}/quarantine:/data/quarantine
    ports:
      - "127.0.0.1:${COLLECTOR_METRICS_PORT:-8000}:${COLLECTOR_METRICS_PORT:-8000}"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ.get('COLLECTOR_METRICS_PORT','8000') + '/healthz', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 2g
    cpus: 2.0
    stop_grace_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - coin-platform

  bingx-collector:
    build:
      context: ./services/collector
    restart: unless-stopped
    depends_on:
      storage-init:
        condition: service_completed_successfully
    environment:
      TZ: UTC
      EXCHANGE: bingx
      BINGX_WS_BASE: ${BINGX_WS_BASE:-wss://open-api-ws.bingx.com/market}
      MARKET_SYMBOLS: ${BINGX_MARKET_SYMBOLS:-BTC-USDT,ETH-USDT,SOL-USDT}
      MARKET_STREAMS: ${BINGX_MARKET_STREAMS:-trade,kline_1m}
      RAW_DATA_ROOT: /data/bronze
      QUARANTINE_DATA_ROOT: /data/quarantine
      COLLECTOR_LOG_LEVEL: ${BINGX_COLLECTOR_LOG_LEVEL:-INFO}
      COLLECTOR_METRICS_PORT: "8030"
      COLLECTOR_QUEUE_SIZE: ${BINGX_COLLECTOR_QUEUE_SIZE:-5000}
      COLLECTOR_STALE_AFTER_SECONDS: ${BINGX_COLLECTOR_STALE_AFTER_SECONDS:-60}
      COLLECTOR_RECONNECT_MAX_SECONDS: ${BINGX_COLLECTOR_RECONNECT_MAX_SECONDS:-60}
      COLLECTOR_WRITE_MAX_ATTEMPTS: ${COLLECTOR_WRITE_MAX_ATTEMPTS:-5}
    volumes:
      - ${COIN_DATA_ROOT:-/data/coin-platform}/bronze:/data/bronze
      - ${COIN_DATA_ROOT:-/data/coin-platform}/quarantine:/data/quarantine
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8030/healthz', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 512m
    cpus: 0.75
    stop_grace_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - coin-platform

  system-trading:
    build:
      context: ./services/system-trading
    restart: unless-stopped
    depends_on:
      storage-init:
        condition: service_completed_successfully
    environment:
      TZ: UTC
      SYSTEM_TRADING_SECRET_DIR: /run/system-trading-secrets
      SYSTEM_TRADING_DATA_DIR: /data
      BINGX_REST_BASE: ${BINGX_REST_BASE:-https://open-api.bingx.com}
    volumes:
      - ${SYSTEM_TRADING_SECRET_ROOT:-./secrets/system-trading}:/run/system-trading-secrets:ro
      - ${SYSTEM_TRADING_TLS_ROOT:-./secrets/system-trading-tls}:/run/system-trading-tls:ro
      - ${COIN_DATA_ROOT:-/data/coin-platform}/system-trading:/data
      - ${COIN_DATA_ROOT:-/data/coin-platform}/paper-ui:/paper:ro
    ports:
      - "${SYSTEM_TRADING_BIND_ADDRESS:-127.0.0.1}:${SYSTEM_TRADING_PORT:-8443}:8443"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import ssl,urllib.request; urllib.request.urlopen('https://127.0.0.1:8443/healthz',context=ssl._create_unverified_context(),timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.25
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "3"}
    networks:
      - coin-platform

  paper-trading:
    build:
      context: ./services/paper-trading
    restart: unless-stopped
    depends_on:
      storage-init:
        condition: service_completed_successfully
      silver-processor:
        condition: service_healthy
    environment:
      TZ: UTC
      SILVER_ROOT: /data/silver
      PAPER_DATA_ROOT: /data/paper
      PAPER_UI_ROOT: /data/paper-ui
      PAPER_DATA_EXCHANGE: ${PAPER_DATA_EXCHANGE:-binance}
      PAPER_SYMBOLS: ${PAPER_SYMBOLS:-BTCUSDT,ETHUSDT}
      PAPER_INTERVAL_SECONDS: ${PAPER_INTERVAL_SECONDS:-60}
      PAPER_STARTING_CASH: ${PAPER_STARTING_CASH:-10000}
      PAPER_TARGET_NOTIONAL: ${PAPER_TARGET_NOTIONAL:-100}
      PAPER_FEE_BPS: ${PAPER_FEE_BPS:-4}
      PAPER_SLIPPAGE_BPS: ${PAPER_SLIPPAGE_BPS:-2}
      PAPER_KILL_SWITCH: ${PAPER_KILL_SWITCH:-false}
      RISK_MAX_ORDER_NOTIONAL: ${RISK_MAX_ORDER_NOTIONAL:-100}
      RISK_MAX_SYMBOL_POSITION: ${RISK_MAX_SYMBOL_POSITION:-150}
      RISK_MAX_GROSS_EXPOSURE: ${RISK_MAX_GROSS_EXPOSURE:-250}
      RISK_MAX_DAILY_LOSS: ${RISK_MAX_DAILY_LOSS:-25}
      RISK_MAX_DRAWDOWN_FRACTION: ${RISK_MAX_DRAWDOWN_FRACTION:-0.02}
      RISK_MAX_TRADES_PER_DAY: ${RISK_MAX_TRADES_PER_DAY:-20}
      RISK_MAX_MARKET_AGE_SECONDS: ${RISK_MAX_MARKET_AGE_SECONDS:-3900}
    volumes:
      - ${COIN_DATA_ROOT:-/data/coin-platform}/silver:/data/silver:ro
      - ${COIN_DATA_ROOT:-/data/coin-platform}/paper:/data/paper
      - ${COIN_DATA_ROOT:-/data/coin-platform}/paper-ui:/data/paper-ui
    group_add:
      - "10004"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8050/healthz',timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    cpus: 0.5
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    networks:
      - paper-control

  paper-futures:
    build:
      context: ./services/paper-futures
    restart: unless-stopped
    depends_on:
      storage-init:
        condition: service_completed_successfully
      silver-processor:
        condition: service_healthy
      wyckoff-shadow-adapter:
        condition: service_healthy
    environment:
      TZ: UTC
      SILVER_ROOT: /data/silver
      WYCKOFF_ROOT: /data/wyckoff
      FUTURES_DATA_ROOT: /data/paper-futures
      FUTURES_DATA_EXCHANGE: ${FUTURES_DATA_EXCHANGE:-binance}
      FUTURES_SYMBOLS: ${FUTURES_SYMBOLS:-BTCUSDT,ETHUSDT}
      FUTURES_EMA_SYMBOLS: ${FUTURES_EMA_SYMBOLS:-BTCUSDT,ETHUSDT}
      FUTURES_EMA_ENTRY_ENABLED: ${FUTURES_EMA_ENTRY_ENABLED:-false}
      FUTURES_EMA_GATE_PERSISTENCE_BARS: ${FUTURES_EMA_GATE_PERSISTENCE_BARS:-3}
      FUTURES_EMA_GATE_MIN_SEPARATION_BPS: ${FUTURES_EMA_GATE_MIN_SEPARATION_BPS:-5}
      FUTURES_EMA_GATE_MIN_SLOPE_BPS: ${FUTURES_EMA_GATE_MIN_SLOPE_BPS:-2}
      FUTURES_EMA_GATE_MAX_EXTENSION_BPS: ${FUTURES_EMA_GATE_MAX_EXTENSION_BPS:-75}
      FUTURES_EMA_GATE_MIN_NET_RR: ${FUTURES_EMA_GATE_MIN_NET_RR:-1.5}
      FUTURES_WYCKOFF_SYMBOLS: ${FUTURES_WYCKOFF_SYMBOLS:-BTCUSDT,ETHUSDT}
      FUTURES_INTERVAL_SECONDS: ${FUTURES_INTERVAL_SECONDS:-60}
      FUTURES_LEVERAGE: "10"
      FUTURES_STARTING_EQUITY: ${FUTURES_STARTING_EQUITY:-10000}
      FUTURES_MARGIN_PER_TRADE: ${FUTURES_MARGIN_PER_TRADE:-100}
      FUTURES_FEE_BPS: ${FUTURES_FEE_BPS:-5}
      FUTURES_PERSONAL_INCOME_TAX_BPS: ${FUTURES_PERSONAL_INCOME_TAX_BPS:-10}
      FUTURES_SLIPPAGE_BPS: ${FUTURES_SLIPPAGE_BPS:-2}
      FUTURES_MAINTENANCE_MARGIN: ${FUTURES_MAINTENANCE_MARGIN:-0.005}
      FUTURES_EMA_STOP_FRACTION: ${FUTURES_EMA_STOP_FRACTION:-0.01}
      FUTURES_EMA_TARGET_FRACTION: ${FUTURES_EMA_TARGET_FRACTION:-0.02}
      FUTURES_MAX_GROSS_NOTIONAL: ${FUTURES_MAX_GROSS_NOTIONAL:-2000}
      FUTURES_MAX_DAILY_LOSS: ${FUTURES_MAX_DAILY_LOSS:-100}
      FUTURES_MAX_DRAWDOWN_FRACTION: ${FUTURES_MAX_DRAWDOWN_FRACTION:-0.05}
      FUTURES_MAX_TRADES_PER_DAY: ${FUTURES_MAX_TRADES_PER_DAY:-30}
      FUTURES_MAX_MARKET_AGE_SECONDS: ${FUTURES_MAX_MARKET_AGE_SECONDS:-3900}
    volumes:
      - ${COIN_DATA_ROOT:-/data/coin-platform}/silver:/data/silver:ro
      - ${COIN_DATA_ROOT:-/data/coin-platform}/wyckoff-signals:/data/wyckoff:ro
      - ${COIN_DATA_ROOT:-/data/coin-platform}/paper-futures:/data/paper-futures
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz',timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    cpus: 0.5
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    networks:
      - coin-platform

  hybrid-signal-adapter:
    build:
      context: ./services/hybrid-signal-adapter
    restart: unless-stopped
    depends_on:
      storage-init:
        condition: service_completed_successfully
      silver-processor:
        condition: service_healthy
    environment:
      TZ: UTC
      SILVER_ROOT: /data/silver
      HYBRID_OUTPUT_ROOT: /data/hybrid-signals
      HYBRID_DATA_EXCHANGE: ${HYBRID_DATA_EXCHANGE:-binance}
      HYBRID_SYMBOLS: ${HYBRID_SYMBOLS:-BTCUSDT,ETHUSDT}
      HYBRID_INTERVAL_SECONDS: ${HYBRID_INTERVAL_SECONDS:-60}
      HYBRID_MAX_MARKET_AGE_SECONDS: ${HYBRID_MAX_MARKET_AGE_SECONDS:-3900}
      HYBRID_MIN_RELATIVE_VOLUME: ${HYBRID_MIN_RELATIVE_VOLUME:-1.0}
      HYBRID_MIN_RR: ${HYBRID_MIN_RR:-2.0}
    volumes:
      - ${COIN_DATA_ROOT:-/data/coin-platform}/silver:/data/silver:ro
      - ${COIN_DATA_ROOT:-/data/coin-platform}/hybrid-signals:/data/hybrid-signals
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8060/healthz',timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    cpus: 0.5
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    networks:
      - coin-platform

  wyckoff-shadow-adapter:
    build:
      context: ./services/wyckoff-shadow-adapter
    restart: unless-stopped
    depends_on:
      storage-init:
        condition: service_completed_successfully
      silver-processor:
        condition: service_healthy
    environment:
      TZ: UTC
      SILVER_ROOT: /data/silver
      WYCKOFF_OUTPUT_ROOT: /data/wyckoff-signals
      WYCKOFF_DATA_EXCHANGE: ${WYCKOFF_DATA_EXCHANGE:-binance}
      WYCKOFF_SYMBOLS: ${WYCKOFF_SYMBOLS:-BTCUSDT,ETHUSDT,SOLUSDT}
      WYCKOFF_INTERVAL_SECONDS: ${WYCKOFF_INTERVAL_SECONDS:-60}
      WYCKOFF_MAX_CATCHUP_BARS: ${WYCKOFF_MAX_CATCHUP_BARS:-96}
      WYCKOFF_MAX_MARKET_AGE_SECONDS: ${WYCKOFF_MAX_MARKET_AGE_SECONDS:-3900}
      WYCKOFF_MIN_RR: ${WYCKOFF_MIN_RR:-2.0}
      WYCKOFF_READY_SCORE: ${WYCKOFF_READY_SCORE:-70}
    volumes:
      - ${COIN_DATA_ROOT:-/data/coin-platform}/silver:/data/silver:ro
      - ${COIN_DATA_ROOT:-/data/coin-platform}/wyckoff-signals:/data/wyckoff-signals
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8070/healthz',timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    cpus: 0.5
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    networks:
      - coin-platform

  silver-quality-exporter:
    build:
      context: ./services/silver-quality-exporter
    restart: unless-stopped
    depends_on:
      silver-processor:
        condition: service_healthy
    environment:
      TZ: UTC
      SILVER_ROOT: /data/silver
      SILVER_QUALITY_INTERVAL_SECONDS: ${SILVER_QUALITY_INTERVAL_SECONDS:-300}
      SILVER_QUALITY_WARNING_LAG_SECONDS: ${SILVER_QUALITY_WARNING_LAG_SECONDS:-1800}
      SILVER_QUALITY_STALE_LAG_SECONDS: ${SILVER_QUALITY_STALE_LAG_SECONDS:-3900}
      SILVER_QUALITY_SOURCES: ${SILVER_QUALITY_SOURCES:-binance:spot:websocket:BTCUSDT:kline_1m;binance:spot:websocket:ETHUSDT:kline_1m;binance:spot:websocket:SOLUSDT:kline_1m;bingx:spot:websocket:BTC-USDT:kline_1min;bingx:spot:websocket:ETH-USDT:kline_1min;bingx:spot:websocket:SOL-USDT:kline_1min}
    volumes:
      - ${COIN_DATA_ROOT:-/data/coin-platform}/silver:/data/silver:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/healthz',timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    cpus: 0.5
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    networks:
      - coin-platform

  liquidity-structure-adapter:
    build:
      context: ./services/liquidity-structure-adapter
    restart: unless-stopped
    depends_on:
      storage-init:
        condition: service_completed_successfully
      silver-processor:
        condition: service_healthy
    environment:
      TZ: UTC
      SILVER_ROOT: /data/silver
      LIQUIDITY_OUTPUT_ROOT: /data/liquidity-structure
      LIQUIDITY_DATA_EXCHANGE: ${LIQUIDITY_DATA_EXCHANGE:-binance}
      LIQUIDITY_SYMBOLS: ${LIQUIDITY_SYMBOLS:-BTCUSDT,ETHUSDT,SOLUSDT}
      LIQUIDITY_INTERVAL_SECONDS: ${LIQUIDITY_INTERVAL_SECONDS:-60}
      LIQUIDITY_MAX_MARKET_AGE_SECONDS: ${LIQUIDITY_MAX_MARKET_AGE_SECONDS:-3900}
    volumes:
      - ${COIN_DATA_ROOT:-/data/coin-platform}/silver:/data/silver:ro
      - ${COIN_DATA_ROOT:-/data/coin-platform}/liquidity-structure:/data/liquidity-structure
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/healthz',timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    cpus: 0.5
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    networks:
      - coin-platform

  evidence-fusion-adapter:
    build:
      context: ./services/evidence-fusion-adapter
    restart: unless-stopped
    depends_on:
      storage-init:
        condition: service_completed_successfully
      wyckoff-shadow-adapter:
        condition: service_healthy
      liquidity-structure-adapter:
        condition: service_healthy
    environment:
      TZ: UTC
      WYCKOFF_PROJECTION_URL: http://wyckoff-shadow-adapter:8070/projection
      LIQUIDITY_PROJECTION_URL: http://liquidity-structure-adapter:8082/projection
      FUSION_OUTPUT_ROOT: /data/evidence-fusion
      FUSION_SYMBOLS: ${FUSION_SYMBOLS:-BTCUSDT,ETHUSDT,SOLUSDT}
      FUSION_INTERVAL_SECONDS: ${FUSION_INTERVAL_SECONDS:-60}
      FUSION_MAX_MARKET_AGE_SECONDS: ${FUSION_MAX_MARKET_AGE_SECONDS:-3900}
      FUSION_CONTINUITY_BARS: ${FUSION_CONTINUITY_BARS:-12}
      LIQUIDITY_SOAK_STATUS: ${LIQUIDITY_SOAK_STATUS:-FAIL}
    volumes:
      - ${COIN_DATA_ROOT:-/data/coin-platform}/evidence-fusion:/data/evidence-fusion
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8084/healthz',timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 192m
    cpus: 0.25
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    networks:
      - coin-platform

  silver-processor:
    build:
      context: ./services/silver-processor
    restart: unless-stopped
    depends_on:
      storage-init:
        condition: service_completed_successfully
      collector:
        condition: service_healthy
    environment:
      TZ: UTC
      BRONZE_ROOT: /data/bronze
      SILVER_ROOT: /data/silver
      SILVER_QUARANTINE_ROOT: /data/silver-quarantine
      SILVER_REPORT_ROOT: /data/reports/silver
      SILVER_CHECKPOINT: /data/checkpoints/silver/state.db
      SILVER_INTERVAL_SECONDS: ${SILVER_INTERVAL_SECONDS:-60}
      SILVER_BATCH_MAX_BYTES: ${SILVER_BATCH_MAX_BYTES:-16777216}
      SILVER_MIN_BATCH_BYTES: ${SILVER_MIN_BATCH_BYTES:-4194304}
      SILVER_METRICS_PORT: ${SILVER_METRICS_PORT:-8010}
      SILVER_LOG_LEVEL: ${SILVER_LOG_LEVEL:-INFO}
    volumes:
      - ${COIN_DATA_ROOT:-/data/coin-platform}/bronze:/data/bronze:ro
      - ${COIN_DATA_ROOT:-/data/coin-platform}/silver:/data/silver
      - ${COIN_DATA_ROOT:-/data/coin-platform}/silver-quarantine:/data/silver-quarantine
      - ${COIN_DATA_ROOT:-/data/coin-platform}/checkpoints:/data/checkpoints
      - ${COIN_DATA_ROOT:-/data/coin-platform}/reports:/data/reports
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ.get('SILVER_METRICS_PORT','8010') + '/healthz',timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 384m
    cpus: 0.75
    stop_grace_period: 45s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    networks:
      - coin-platform

  strategy-research:
    build:
      context: ./services/strategy-research
    restart: unless-stopped
    depends_on:
      storage-init:
        condition: service_completed_successfully
      silver-processor:
        condition: service_healthy
    environment:
      TZ: UTC
      SILVER_ROOT: /data/silver
      RESEARCH_ROOT: /data/research
      RESEARCH_INTERVAL_SECONDS: ${RESEARCH_INTERVAL_SECONDS:-21600}
    volumes:
      - ${COIN_DATA_ROOT:-/data/coin-platform}/silver:/data/silver:ro
      - ${COIN_DATA_ROOT:-/data/coin-platform}/research:/data/research
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8020/healthz',timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    networks:
      - coin-platform

  prometheus:
    image: prom/prometheus:v3.10.0
    restart: unless-stopped
    depends_on:
      storage-init:
        condition: service_completed_successfully
      collector:
        condition: service_healthy
      bingx-collector:
        condition: service_healthy
      hybrid-signal-adapter:
        condition: service_healthy
      silver-processor:
        condition: service_healthy
      node-exporter:
        condition: service_started
      cadvisor:
        condition: service_started
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts:/etc/prometheus/alerts:ro
      - ${COIN_DATA_ROOT:-/data/coin-platform}/prometheus:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/healthy >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 384m
    cpus: 0.75
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    networks:
      - coin-platform
      - paper-control

  grafana:
    image: grafana/grafana:13.1.0
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_DOMAIN: ${GRAFANA_SERVER_DOMAIN:-localhost}
    volumes:
      - ${COIN_DATA_ROOT:-/data/coin-platform}/grafana:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana-dashboards:ro
    ports:
      - "${MONITORING_BIND_ADDRESS:-127.0.0.1}:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 384m
    cpus: 0.75
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    networks:
      - coin-platform

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.11.1
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --collector.textfile.directory=/textfile
    pid: host
    volumes:
      - /:/host:ro,rslave
      - ${COIN_DATA_ROOT:-/data/coin-platform}/node-exporter-textfile:/textfile:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9100/metrics >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 96m
    cpus: 0.25
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    networks:
      - coin-platform

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 192m
    cpus: 0.5
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    networks:
      - coin-platform

  storage-metrics:
    image: alpine:3.20
    restart: unless-stopped
    user: "0:0"
    depends_on:
      storage-init:
        condition: service_completed_successfully
    command: ["/bin/sh", "/scripts/update-storage-metrics.sh"]
    volumes:
      - ${COIN_DATA_ROOT:-/data/coin-platform}:/coin-data:ro
      - ${COIN_DATA_ROOT:-/data/coin-platform}/node-exporter-textfile:/textfile
      - ./scripts/update-storage-metrics.sh:/scripts/update-storage-metrics.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "test -s /textfile/coin_storage.prom && find /textfile/coin_storage.prom -mmin -2 | grep -q ."]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 64m
    cpus: 0.2
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
    networks:
      - coin-platform

networks:
  coin-platform:
    driver: bridge
  paper-control:
    internal: true
    driver: bridge
