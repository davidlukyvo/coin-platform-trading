services:
  storage-init:
    image: alpine:3.20
    user: "0:0"
    command:
      - /bin/sh
      - -ec
      - |
        mkdir -p /host/bronze /host/quarantine /host/postgres
        chown -R 10001:10001 /host/bronze /host/quarantine
        chown -R 70:70 /host/postgres
        test -w /host/bronze
        test -w /host/quarantine
        test -w /host/postgres
    volumes:
      - ${COIN_DATA_ROOT:-/data/coin-platform}:/host
    restart: "no"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      storage-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: UTC
    volumes:
      - ${COIN_DATA_ROOT:-/data/coin-platform}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 2g
    cpus: 1.5
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - coin-platform

  collector:
    build:
      context: ./services/collector
    restart: unless-stopped
    depends_on:
      storage-init:
        condition: service_completed_successfully
    environment:
      TZ: UTC
      BINANCE_WS_BASE: ${BINANCE_WS_BASE}
      MARKET_SYMBOLS: ${MARKET_SYMBOLS}
      MARKET_STREAMS: ${MARKET_STREAMS}
      RAW_DATA_ROOT: /data/bronze
      QUARANTINE_DATA_ROOT: /data/quarantine
      COLLECTOR_LOG_LEVEL: ${COLLECTOR_LOG_LEVEL}
      COLLECTOR_METRICS_PORT: ${COLLECTOR_METRICS_PORT:-8000}
      COLLECTOR_QUEUE_SIZE: ${COLLECTOR_QUEUE_SIZE:-10000}
      COLLECTOR_STALE_AFTER_SECONDS: ${COLLECTOR_STALE_AFTER_SECONDS:-60}
      COLLECTOR_RECONNECT_MAX_SECONDS: ${COLLECTOR_RECONNECT_MAX_SECONDS:-60}
      COLLECTOR_WRITE_MAX_ATTEMPTS: ${COLLECTOR_WRITE_MAX_ATTEMPTS:-5}
    volumes:
      - ${COIN_DATA_ROOT:-/data/coin-platform}/bronze:/data/bronze
      - ${COIN_DATA_ROOT:-/data/coin-platform}/quarantine:/data/quarantine
    ports:
      - "127.0.0.1:${COLLECTOR_METRICS_PORT:-8000}:${COLLECTOR_METRICS_PORT:-8000}"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ.get('COLLECTOR_METRICS_PORT','8000') + '/healthz', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 2g
    cpus: 2.0
    stop_grace_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - coin-platform

networks:
  coin-platform:
    driver: bridge
