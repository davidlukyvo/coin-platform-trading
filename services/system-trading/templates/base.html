<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>System Trading · BingX</title>
  <style>
    :root{color-scheme:dark;--bg:#0b1020;--card:#151c2f;--line:#27324b;--text:#edf2ff;--muted:#9ba8c4;--green:#55d69e;--red:#ff7187;--blue:#6ea8fe}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#182848 0,var(--bg) 40%);font:15px system-ui;color:var(--text)}main{max-width:1100px;margin:55px auto;padding:0 20px}.brand{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.brand h1{margin:0;font-size:27px}.badge{padding:7px 11px;border:1px solid #315b4e;border-radius:999px;color:var(--green);background:#10291f}.card{background:rgba(21,28,47,.96);border:1px solid var(--line);border-radius:14px;padding:24px;margin-bottom:18px;box-shadow:0 18px 50px #0005}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:650px){.grid{grid-template-columns:1fr}}label{display:block;color:var(--muted);margin:12px 0 6px}input{width:100%;padding:12px;border:1px solid #3a4765;border-radius:8px;background:#0d1425;color:var(--text)}button{margin-top:16px;padding:11px 15px;border:0;border-radius:8px;background:var(--blue);color:#081020;font-weight:700;cursor:pointer}.secondary{background:#26334d;color:var(--text)}.danger{background:#6b2330;color:#fff}.note{color:var(--muted);line-height:1.6}.flash{padding:12px 14px;border-radius:8px;margin:12px 0}.flash.success{background:#123b2c;color:#8bf0c1}.flash.error{background:#4a1d28;color:#ffadba}.status{display:flex;gap:16px;flex-wrap:wrap}.status span{background:#0c1425;border:1px solid var(--line);padding:8px 10px;border-radius:7px}code{color:#bcd1ff}form.inline{display:inline-block;margin-right:8px}table{width:100%;border-collapse:collapse;margin-top:12px}th,td{text-align:right;padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}th:first-child,td:first-child{text-align:left}th{color:var(--muted);font-weight:600}
  </style>
</head>
<body><main>{% block body %}{% endblock %}</main></body>
</html>
